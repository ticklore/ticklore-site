# Default profile — works on any normal machine.
# Foundry downloads and manages solc 0.8.28 itself.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200

# Sandbox-only profile.
#
# The official Solidity download host (binaries.soliditylang.org) is blocked
# inside Claude's container, so solc is fetched from GitHub's release mirror
# by setup-sandbox.sh and referenced here by absolute path.
#
# That path exists ONLY in the sandbox. Never make it the default — doing so
# breaks the build on every real developer machine.
#
#   Run with:  FOUNDRY_PROFILE=sandbox forge test
[profile.sandbox]
src = "src"
out = "out"
libs = ["lib"]
solc = "/home/claude/.solc/solc"
optimizer = true
optimizer_runs = 200

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
